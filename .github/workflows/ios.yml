name: iOS CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "fastlane/screenshots/**"
  workflow_dispatch:

# Build numbers come from TestFlight, so two uploads must never run at once.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # App Store Connect API key (base64) — see RELEASE.md
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      # fastlane match
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      # Comma-separated external TestFlight groups; empty = upload only.
      TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
      CHANGELOG: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build & upload to TestFlight
        run: bundle exec fastlane beta
