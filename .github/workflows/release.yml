name: App Store release

on:
  workflow_dispatch:
    inputs:
      whats_new:
        description: "What's New text for the App Store"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Submit to App Store review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          WHATS_NEW: ${{ inputs.whats_new }}
        run: bundle exec fastlane release
