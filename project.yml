# XcodeGen fallback — regenerate Timezen.xcodeproj with:  xcodegen generate
# (Only needed if the checked-in .xcodeproj ever gets out of sync.)
name: Timezen
options:
  bundleIdPrefix: io.solidtime
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Timezen:
    type: application
    platform: iOS
    sources:
      - path: Timezen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afanasievmaksym.timezen
        INFOPLIST_FILE: Timezen/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
